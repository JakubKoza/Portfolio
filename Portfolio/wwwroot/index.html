<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <base href="/Portfolio" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/satoshi.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="Portfolio.styles.css" />
    <link rel="stylesheet" href="_content/Radzen.Blazor/css/material-dark.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script type="importmap"></script>
    <style>
        html, body {
            background-color: black;
            margin: 0;
            padding: 0;
        }
        .loading-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            font-family: 'Satoshi', sans-serif;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #333; 
            border-top-color: #6c6785;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .loading-text {
            margin-top: 20px;
            color: #cfcfcf;
            font-size: 20px;
            font-weight: 200;
            letter-spacing: 2px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <<div class="loading-container">
            <div class="spinner"></div>
            <div class="loading-text">LOADING...</div>
        </div>
    </div>

    <div id="blazor-error-ui" style="display: none !important;">
        An unhandled error has occurred.`
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>


    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>

</body>

</html>
